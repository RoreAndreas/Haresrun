<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>HARES RUN</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Carte"></div>
  <div id="map-empty" class="map-empty" hidden>
    <p>La carte n'a pas pu se charger.</p>
    <button class="btn btn--accent" onclick="location.reload()">Réessayer</button>
  </div>

  <div class="map-tools" role="toolbar" aria-label="Outils de carte">
    <select id="layer" class="select" aria-label="Fond de carte">
      <option value="simple">Simplifiée</option>
      <option value="dark">Complète</option>
      <option value="light">Claire</option>
      <option value="satellite">Satellite</option>
    </select>
    <button class="btn" data-action="undo">Annuler</button>
    <button class="btn" data-action="clear">Effacer</button>
  </div>

  <aside id="panel" class="panel">
    <header class="head">
      <button class="head__toggle" data-action="toggle-sheet" aria-label="Agrandir ou réduire le panneau"></button>
      <h1>HARES RUN</h1>
      <span class="head__sum" id="summary">0,00 km</span>
    </header>

    <div class="panel__scroll">
      <form id="search" class="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Chercher un lieu" enterkeyhint="search">
      </form>
      <ul id="search-results" class="results" hidden></ul>

      <section class="block">
        <p id="hint" class="muted"></p>
        <ol id="points" class="points"></ol>
        <button class="btn btn--block" data-action="start-here">Partir de ma position</button>
        <div class="row row--between">
          <label class="check"><input id="loop" type="checkbox"> Boucle</label>
          <label class="check" title="Décoche pour relier les points en ligne droite (sentier absent de la carte)"><input id="follow" type="checkbox"> Suivre les chemins</label>
        </div>
      </section>

      <section class="block">
        <p class="total"><b id="st-dist">0,00</b> km <span id="st-gain" class="muted"></span></p>
        <div class="pace">
          <div class="field">
            <span>Temps prévu</span>
            <div class="field__inputs">
              <input id="t-h" type="number" min="0" max="99" inputmode="numeric" placeholder="0" aria-label="heures"> h
              <input id="t-m" type="number" min="0" max="59" inputmode="numeric" placeholder="00" aria-label="minutes"> min
              <input id="t-s" type="number" min="0" max="59" inputmode="numeric" placeholder="00" aria-label="secondes"> s
            </div>
          </div>
          <div class="field">
            <span>Allure par km</span>
            <div class="field__inputs">
              <input id="p-m" type="number" min="0" max="59" inputmode="numeric" placeholder="5" aria-label="minutes"> :
              <input id="p-s" type="number" min="0" max="59" inputmode="numeric" placeholder="00" aria-label="secondes">
            </div>
          </div>
        </div>
        <p id="pace-out" class="muted"></p>
      </section>

      <button class="btn btn--accent btn--block export-btn" data-action="open-export">Exporter en PNG</button>
      <a id="osm-edit" class="osm-edit small" href="https://www.openstreetmap.org/edit" target="_blank" rel="noopener">Un chemin manque ? L'ajouter sur OpenStreetMap</a>
    </div>
  </aside>

  <dialog id="export-dialog" class="dialog dialog--wide">
    <div class="export">
      <canvas id="poster" width="1080" height="1350"></canvas>
      <div class="export__opts">
        <h2>Exporter en PNG</h2>
        <input id="run-name" class="input" type="text" maxlength="40" placeholder="Nom du run">
        <label class="check"><input id="with-map" type="checkbox"> Fond de carte</label>
        <p id="export-note" class="muted small"></p>
        <button class="btn btn--accent btn--block" data-action="download">Télécharger</button>
        <button class="btn btn--block" data-action="close-export">Fermer</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="poster.js"></script>
  <script src="app.js"></script>
</body>
</html>
